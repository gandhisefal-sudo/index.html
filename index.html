<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Unified 3-Column Accumulator</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    body { font-family: Segoe UI, Tahoma, Geneva, Verdana, sans-serif; background: #f4f6f8; margin: 20px; color: #333; }
    .card { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 20px; }
    h2 { margin-top: 0; color: #0066c0; font-size: 22px; display: flex; align-items: center; gap: 8px; }
    p.subtitle { color: #555; font-size: 14px; margin-bottom: 12px; }
    textarea { width: 100%; height: 110px; border: 1px solid #ccc; border-radius: 6px; padding: 10px; font-family: monospace; box-sizing: border-box; resize: vertical; }
    .btn-group { margin-top: 12px; display: flex; gap: 10px; }
    button { border: none; padding: 10px 18px; font-weight: bold; border-radius: 6px; cursor: pointer; color: white; transition: opacity 0.2s; }
    button:hover { opacity: 0.9; }
    .btn-process { background-color: #2e7d32; }
    .btn-export { background-color: #00796b; }
    .btn-reset { background-color: #888; }

    .columns-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .col-card { background: #fff; border-radius: 8px; border: 1px solid #e0e0e0; overflow: hidden; }
    .col-header { background: #0066c0; color: white; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
    .col-header h3 { margin: 0; font-size: 16px; }
    .col-header span.subtitle-floor { font-size: 11px; opacity: 0.8; display: block; }
    .badge { background: rgba(255,255,255,0.25); padding: 4px 10px; border-radius: 12px; font-size: 13px; font-weight: bold; }
    
    .table-container { padding: 12px; max-height: 500px; overflow-y: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    td { padding: 6px 8px; text-align: left; border-bottom: 1px solid #eee; }
    .count-col { text-align: right; font-weight: bold; color: #111; }
    .section-header { background: #e3f2fd; font-weight: bold; color: #0d47a1; font-size: 11px; letter-spacing: 0.5px; }
    .buffer-header { background: #fff3e0; color: #e65100; }
    .empty-msg { text-align: center; color: #888; font-style: italic; padding: 20px 0; font-size: 13px; }
  </style>
</head>
<body>

  <div class="card">
    <h2>📊 Unified 3-Column Accumulator</h2>
    <p class="subtitle">Paste data tab by tab. Stations automatically sort into <strong>DZ-P-A2000</strong>, <strong>DZ-P-A3000</strong>, or <strong>DZ-P-A4000</strong> columns with clear visual separation between A and B fields.</p>
    <textarea id="input-data" placeholder="Paste station data here..."></textarea>
    <div class="btn-group">
      <button class="btn-process" onclick="processData()">Process & Sum Quantities</button>
      <button class="btn-export" onclick="exportToExcel()">📊 Export to Excel</button>
      <button class="btn-reset" onclick="resetCalculator()">Reset</button>
    </div>
  </div>

  <div class="columns-grid">
    <div class="col-card">
      <div class="col-header">
        <div><h3>DZ-P-A2000</h3><span class="subtitle-floor">A2 & B2 Fields</span></div>
        <div id="badge-a2000" class="badge">0 Units</div>
      </div>
      <div id="table-a2000" class="table-container"></div>
    </div>

    <div class="col-card">
      <div class="col-header">
        <div><h3>DZ-P-A3000</h3><span class="subtitle-floor">A3 & B3 Fields</span></div>
        <div id="badge-a3000" class="badge">0 Units</div>
      </div>
      <div id="table-a3000" class="table-container"></div>
    </div>

    <div class="col-card">
      <div class="col-header">
        <div><h3>DZ-P-A4000</h3><span class="subtitle-floor">A4 & B4 Fields</span></div>
        <div id="badge-a4000" class="badge">0 Units</div>
      </div>
      <div id="table-a4000" class="table-container"></div>
    </div>
  </div>

  <script>
    // Persistent state initialization
    let masterInventory = {};
    try {
      masterInventory = JSON.parse(localStorage.getItem('fc_master_inventory')) || {};
    } catch(e) {
      masterInventory = {};
    }

    document.addEventListener('DOMContentLoaded', () => { renderTables(); });

    function processData() {
      const rawText = document.getElementById('input-data').value;
      if (!rawText.trim()) return;

      const lines = rawText.trim().split('\n');
      lines.forEach(line => {
        const cols = line.split(/\t+|\s{2,}/).map(c => c.trim()).filter(Boolean);
        if (cols.length >= 2) {
          const station = cols[0].replace(/\s+md-A$/i, '');
          const count = parseInt(cols[1], 10);
          
          if (station && !isNaN(count) && !station.toLowerCase().includes('scannable id')) {
            masterInventory[station] = (masterInventory[station] || 0) + count;
          }
        }
      });

      localStorage.setItem('fc_master_inventory', JSON.stringify(masterInventory));
      document.getElementById('input-data').value = '';
      renderTables();
    }

    function getFloorGroup(station) {
      if (/[ABpP]3|3\d{3}|P3/i.test(station)) return 'A3000';
      if (/[ABpP]4|4\d{3}|P4/i.test(station)) return 'A4000';
      return 'A2000';
    }

    function isFieldA(station) {
      return /[\-_]A\d+/i.test(station) || station.includes('md-A');
    }

    function renderTables() {
      const floors = {
        'A2000': { a: [], b: [], total: 0 },
        'A3000': { a: [], b: [], total: 0 },
        'A4000': { a: [], b: [], total: 0 }
      };

      Object.keys(masterInventory).forEach(station => {
        const count = masterInventory[station];
        const floorKey = getFloorGroup(station);
        floors[floorKey].total += count;

        if (isFieldA(station)) {
          floors[floorKey].a.push({ station, count });
        } else {
          floors[floorKey].b.push({ station, count });
        }
      });

      ['A2000', 'A3000', 'A4000'].forEach(floorKey => {
        const keyLower = floorKey.toLowerCase();
        const container = document.getElementById(`table-${keyLower}`);
        const badge = document.getElementById(`badge-${keyLower}`);
        const data = floors[floorKey];

        if (badge) badge.innerText = `${data.total.toLocaleString()} Units`;
        if (!container) return;

        if (data.a.length === 0 && data.b.length === 0) {
          container.innerHTML = `<div class="empty-msg">No ${floorKey} / B${floorKey.slice(1)} data</div>`;
          return;
        }

        let html = '<table>';
        if (data.a.length > 0) {
          html += `<tr class="section-header"><td colspan="2">A-FIELD STATIONS</td></tr>`;
          data.a.sort((x, y) => x.station.localeCompare(y.station)).forEach(row => {
            html += `<tr><td>${row.station}</td><td class="count-col">${row.count}</td></tr>`;
          });
        }
        if (data.b.length > 0) {
          html += `<tr class="section-header buffer-header"><td colspan="2">B-FIELD / BUFFER STATIONS</td></tr>`;
          data.b.sort((x, y) => x.station.localeCompare(y.station)).forEach(row => {
            html += `<tr><td>${row.station}</td><td class="count-col">${row.count}</td></tr>`;
          });
        }
        html += '</table>';
        container.innerHTML = html;
      });
    }

    function resetCalculator() {
      localStorage.removeItem('fc_master_inventory');
      masterInventory = {};
      document.getElementById('input-data').value = '';
      renderTables();
    }

    function exportToExcel() {
      const rows = [['Station Name', 'Count', 'Floor', 'Field']];
      Object.keys(masterInventory).forEach(station => {
        rows.push([
          station, 
          masterInventory[station], 
          getFloorGroup(station), 
          isFieldA(station) ? 'A-Field' : 'B-Field/Buffer'
        ]);
      });
      
      const ws = XLSX.utils.aoa_to_sheet(rows);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Inventory Accumulation');
      XLSX.writeFile(wb, 'FC_Station_Counts.xlsx');
    }
  </script>
</body>
</html>
