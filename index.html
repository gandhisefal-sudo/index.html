<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unified Station Quantity Accumulator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 20px;
            background-color: #f4f6f9;
            color: #333;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h2 {
            color: #0066c0;
            margin-top: 0;
            border-bottom: 2px solid #e7e9ec;
            padding-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        p {
            font-size: 0.95rem;
            color: #555;
            line-height: 1.5;
        }
        textarea {
            width: 100%;
            height: 180px;
            padding: 12px;
            border: 1px solid #a6a6a6;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.9rem;
            resize: vertical;
            box-sizing: border-box;
            background-color: #fafafa;
        }
        textarea:focus {
            border-color: #0066c0;
            outline: none;
            background-color: #fff;
        }
        .btn-group {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }
        button {
            padding: 10px 20px;
            font-size: 0.9rem;
            font-weight: bold;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-process {
            background-color: #2cba00;
            color: white;
        }
        .btn-process:hover {
            background-color: #249700;
        }
        .btn-clear {
            background-color: #a6a6a6;
            color: white;
        }
        .btn-clear:hover {
            background-color: #8c8c8c;
        }
        .sort-section {
            margin-top: 25px;
            background: #f7f9fa;
            padding: 12px;
            border-radius: 4px;
            border: 1px solid #e7e9ec;
            display: none;
        }
        .sort-label {
            font-weight: bold;
            font-size: 0.9rem;
            margin-right: 10px;
        }
        .sort-btn {
            background: #fff;
            border: 1px solid #a6a6a6;
            padding: 5px 12px;
            font-size: 0.85rem;
            color: #333;
            border-radius: 4px;
            margin-right: 5px;
        }
        .sort-btn:hover {
            background: #f0f2f2;
            border-color: #848484;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            display: none;
            background: #fff;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #e7e9ec;
        }
        th {
            background-color: #f7f9fa;
            color: #555;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
        }
        .station-row-interactive {
            cursor: pointer;
            transition: background 0.15s;
        }
        .station-row-interactive:hover {
            background-color: #f5f9fc;
        }
        .toggle-indicator {
            display: inline-block;
            width: 15px;
            color: #888;
            font-size: 0.75rem;
        }
        .badge {
            background-color: #e1f0fc;
            color: #0066c0;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 0.75rem;
            font-weight: bold;
            margin-left: 8px;
        }
        .nested-row {
            background-color: #fcfdfe;
        }
        .nested-container-box {
            padding: 15px;
            border-left: 4px solid #0066c0;
            background: #f7fafd;
            margin: 5px 0;
            border-radius: 0 4px 4px 0;
        }
        .nested-title {
            font-weight: bold;
            font-size: 0.9rem;
            color: #0066c0;
            margin-bottom: 10px;
        }
        .inner-data-table {
            display: table !important;
            width: 100%;
            margin-top: 0;
            box-shadow: none;
            background: transparent;
        }
        .inner-data-table th {
            background: #edf4fa;
            color: #444;
            font-size: 0.75rem;
        }
        .inner-data-table td {
            padding: 8px 12px;
            font-size: 0.85rem;
            background: #fff;
        }
        .sku-item {
            padding: 3px 0;
            border-bottom: 1px dashed #e7e9ec;
        }
        .sku-item:last-child {
            border-bottom: none;
        }
        .tote-link {
            color: #0066c0;
            text-decoration: none;
            font-weight: bold;
        }
        .tote-link:hover {
            text-decoration: underline;
        }
        .total-row {
            background-color: #e7e9ec;
            font-weight: bold;
            font-size: 1.05rem;
        }
        .total-row td {
            border-top: 2px solid #ccc;
            color: #111;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>📊 Unified Station Quantity Accumulator</h2>
    <p>Paste the copied lists from all your different portal tabs consecutively into the box below, then hit calculate.</p>
    
    <textarea id="inputBox" placeholder="Paste station data here..."></textarea>
    
    <div class="btn-group">
        <button class="btn-process" onclick="calculateTotals()">Process & Sum Quantities</button>
        <button class="btn-clear" onclick="clearAll()">Reset</button>
    </div>

    <div id="sortControls" class="sort-section">
        <span class="sort-label">Sort Output Table:</span>
        <button class="sort-btn" onclick="sortData('name', 'asc')">Station (A-Z)</button>
        <button class="sort-btn" onclick="sortData('name', 'desc')">Station (Z-A)</button>
        <button class="sort-btn" onclick="sortData('qty', 'desc')">Quantity (High-Low)</button>
        <button class="sort-btn" onclick="sortData('qty', 'asc')">Quantity (Low-High)</button>
    </div>

    <table id="resultTable">
        <thead>
            <tr>
                <th>Station Name (Click to expand totes)</th>
                <th>Aggregated Unit Count</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

<script>
    let accumulatedDataGlobal = {};
    let currentSortedList = [];
    let expandedStations = new Set();

    function calculateTotals() {
        let rawText = document.getElementById("inputBox").value;
        if (!rawText.trim()) {
            alert("Please paste data into the box first!");
            return;
        }

        accumulatedDataGlobal = {}; 

        let sanitizedText = rawText.replace(/\u00A0/g, ' ').trim();
        let jsonBlocks = extractTopLevelJSONBlocks(sanitizedText);
        let parsedSuccessfully = false;

        if (jsonBlocks.length > 0) {
            jsonBlocks.forEach(block => {
                try {
                    let parsedJson = JSON.parse(block);
                    let normalizedArray = Array.isArray(parsedJson) ? parsedJson : [parsedJson];
                    processJsonArray(normalizedArray, accumulatedDataGlobal);
                    parsedSuccessfully = true;
                } catch (e) {
                    console.error("Failed parsing JSON block:", e);
                }
            });
        }

        if (!parsedSuccessfully) {
            processTextFallback(sanitizedText, accumulatedDataGlobal);
        }

        currentSortedList = Object.keys(accumulatedDataGlobal).map(key => {
            let itemData = accumulatedDataGlobal[key];
            let finalStationQty = 0;
            itemData.containers.forEach(c => {
                finalStationQty += c.qty;
            });

            return { 
                station: key, 
                qty: finalStationQty, 
                containers: itemData.containers 
            };
        });

        if (currentSortedList.length > 0) {
            sortData('name', 'asc');
            document.getElementById("sortControls").style.display = "block";
            document.getElementById("resultTable").style.display = "table";
        } else {
            alert("No valid DZ-P or BUFFER data rows were identified. Check your selection.");
        }
    }

    function extractTopLevelJSONBlocks(text) {
        let blocks = [];
        let bracketCount = 0;
        let braceCount = 0;
        let startIdx = -1;
        let inString = false;

        for (let i = 0; i < text.length; i++) {
            let char = text[i];
            if (char === '"' && text[i - 1] !== '\\') {
                inString = !inString;
                continue;
            }
            if (!inString) {
                if (char === '[' || char === '{') {
                    if (bracketCount === 0 && braceCount === 0) startIdx = i;
                    if (char === '[') bracketCount++;
                    if (char === '{') braceCount++;
                } else if (char === ']' || char === '}') {
                    if (char === ']') bracketCount--;
                    if (char === '}') braceCount--;
                    if (bracketCount === 0 && braceCount === 0 && startIdx !== -1) {
                        blocks.push(text.substring(startIdx, i + 1));
                        startIdx = -1;
                    }
                }
            }
        }
        return blocks;
    }

    function processJsonArray(array, targetMap) {
        array.forEach(item => {
            let station = item.station?.toUpperCase().trim();
            if (!station || (!station.includes("DZ-P") && !station.includes("BUFFER"))) return;
            
            if (!targetMap[station]) {
                targetMap[station] = { qty: 0, containers: [] };
            }
            
            if (item.containers && Array.isArray(item.containers)) {
                item.containers.forEach(newContainer => {
                    let containerIdClean = newContainer.containerId?.trim();
                    if (!containerIdClean) return;

                    let existingContainer = targetMap[station].containers.find(c => c.containerId === containerIdClean);
                    
                    if (!existingContainer) {
                        let containerCopy = {
                            containerId: containerIdClean,
                            qty: parseInt(newContainer.qty, 10) || 0,
                            items: []
                        };
                        if (newContainer.items && Array.isArray(newContainer.items)) {
                            newContainer.items.forEach(it => {
                                containerCopy.items.push({ sku: it.sku, qty: parseInt(it.qty, 10) || 0 });
                            });
                        }
                        targetMap[station].containers.push(containerCopy);
                    } else {
                        if (newContainer.items && Array.isArray(newContainer.items)) {
                            newContainer.items.forEach(newSkuItem => {
                                let existingSku = existingContainer.items.find(s => s.sku === newSkuItem.sku);
                                let incomingSkuQty = parseInt(newSkuItem.qty, 10) || 0;
                                
                                if (!existingSku) {
                                    existingContainer.items.push({ sku: newSkuItem.sku, qty: incomingSkuQty });
                                    existingContainer.qty += incomingSkuQty;
                                } else {
                                    if (existingSku.qty !== incomingSkuQty) {
                                        existingSku.qty += incomingSkuQty;
                                        existingContainer.qty += incomingSkuQty;
                                    }
                                }
                            });
                        }
                    }
                });
            }
        });
    }

    function processTextFallback(rawText, targetMap) {
        let lines = rawText.split('\n');
        lines.forEach(line => {
            if (!line.trim()) return;
            let parts = line.split(/\t+/);
            if (parts.length < 2) parts = line.split(/\s{2,}/); 
            
            if (parts.length >= 2) {
                let station = parts[0].trim().toUpperCase();
                if (!station || (!station.includes("DZ-P") && !station.includes("BUFFER"))) return;

                let qty = parseInt(parts[1].trim(), 10) || 0;
                if (!targetMap[station]) {
                    targetMap[station] = { qty: 0, containers: [] };
                }
                
                let fallbackToteId = "MANUAL-PASTE-TOTAL";
                let existingContainer = targetMap[station].containers.find(c => c.containerId === fallbackToteId);
                
                if (!existingContainer) {
                    targetMap[station].containers.push({ containerId: fallbackToteId, qty: qty, items: [] });
                } else {
                    if (existingContainer.qty !== qty) {
                        existingContainer.qty += qty;
                    }
                }
            }
        });
    }

    function toggleStation(stationName) {
        if (expandedStations.has(stationName)) {
            expandedStations.delete(stationName);
        } else {
            expandedStations.add(stationName);
        }
        renderTable();
    }

    function sortData(type, direction) {
        if (currentSortedList.length === 0) return;
        if (type === 'name') {
            currentSortedList.sort((a, b) => direction === 'asc' ? a.station.localeCompare(b.station) : b.station.localeCompare(a.station));
        } else if (type === 'qty') {
            currentSortedList.sort((a, b) => direction === 'asc' ? a.qty - b.qty : b.qty - a.qty);
        }
        renderTable();
    }

    function renderTable() {
        let tbody = document.getElementById("tableBody");
        tbody.innerHTML = "";
        let totalSum = 0;

        currentSortedList.forEach(item => {
            totalSum += item.qty;
            let hasExtraData = item.containers && item.containers.length > 0;
            let isExpanded = expandedStations.has(item.station);
            
            let tr = document.createElement("tr");
            if (hasExtraData) {
                tr.className = "station-row-interactive";
                tr.onclick = () => toggleStation(item.station);
            }
            
            tr.innerHTML = `
                <td style="font-family: monospace; font-weight: bold;">
                    ${hasExtraData ? `<span class="toggle-indicator">${isExpanded ? '▼' : '▶'}</span>` : ''}
                    ${item.station}
                </td>
                <td style="color: #0066c0; font-weight: bold;">
                    ${item.qty}
                    ${hasExtraData && item.containers[0].containerId !== "MANUAL-PASTE-TOTAL" ? `<span class="badge">${item.containers.length} Totes</span>` : ''}
                </td>
            `;
            tbody.appendChild(tr);

            if (hasExtraData && isExpanded) {
                let nestedTr = document.createElement("tr");
                nestedTr.className = "nested-row";
                let isManual = item.containers[0].containerId === "MANUAL-PASTE-TOTAL";
                
                let innerHtmlMarkup = `
                    <td colspan="2">
                        <div class="nested-container-box">
                            <div class="nested-title">${isManual ? '📋 Plain Text Stack Breakdown' : '📦 Totes Under Station'}</div>
                            <table class="inner-data-table">
                                <thead>
                                    <tr>
                                        <th>${isManual ? 'Source' : 'Tote ID'}</th>
                                        <th>Items & Quantities</th>
                                    </tr>
                                </thead>
                                <tbody>
                `;

                item.containers.forEach(container => {
                    let skuDetails = "";
                    if (container.items && container.items.length > 0) {
                        container.items.forEach(skuItem => {
                            skuDetails += `<div class="sku-item">🔹 <strong>${skuItem.sku}</strong> (x${skuItem.qty})</div>`;
                        });
                    } else {
                        skuDetails = `<div style="color: #333; font-weight: bold;">x${container.qty} total items</div>`;
                    }

                    let cellLabel = container.containerId;
                    if (!isManual) {
                        let fcResearchUrl = `https://fcresearch-eu.aka.amazon.com/LCY2/results?s=${container.containerId}`;
                        cellLabel = `<a href="${fcResearchUrl}" target="_blank" class="tote-link" title="Open directly in FC Research" onclick="event.stopPropagation();">🔗 ${container.containerId}</a>`;
                    } else {
                        cellLabel = `📝 Multi-Tab Accumulation`;
                    }

                    innerHtmlMarkup += `
                        <tr>
                            <td style="font-family: monospace; font-weight:600;">${cellLabel}</td>
                            <td>${skuDetails}</td>
                        </tr>
                    `;
                });

                innerHtmlMarkup += `</tbody></table></div></td>`;
                nestedTr.innerHTML = innerHtmlMarkup;
                tbody.appendChild(nestedTr);
            }
        });

        let totalTr = document.createElement("tr");
        totalTr.className = "total-row";
        totalTr.innerHTML = `<td>GRAND TOTAL ITEMS</td><td>${totalSum}</td>`;
        tbody.appendChild(totalTr);
    }

    function clearAll() {
        accumulatedDataGlobal = {};
        currentSortedList = [];
        expandedStations.clear();
        document.getElementById("inputBox").value = "";
        document.getElementById("tableBody").innerHTML = "";
        document.getElementById("resultTable").style.display = "none";
        document.getElementById("sortControls").style.display = "none";
    }
</script>

</body>
</html>
