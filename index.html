<script>
    let masterInventory = {};
    try {
      masterInventory = JSON.parse(localStorage.getItem('fc_master_inventory')) || {};
    } catch(e) {
      masterInventory = {};
    }

    document.addEventListener('DOMContentLoaded', () => { renderTables(); });

    function processData() {
      const rawText = document.getElementById('input-data').value;
      if (!rawText.trim()) return;

      const parsedItems = parseInputData(rawText);

      if (parsedItems.length === 0) {
        alert("No valid station/quantity data found. Please check copied text.");
        return;
      }

      parsedItems.forEach(({ station, count }) => {
        masterInventory[station] = (masterInventory[station] || 0) + count;
      });

      try {
        localStorage.setItem('fc_master_inventory', JSON.stringify(masterInventory));
      } catch(e) {}

      document.getElementById('input-data').value = '';
      renderTables();
    }

    function parseInputData(rawText) {
      const results = [];
      const cleaned = rawText.trim();
      const ignoredKeys = /^(scannable|id|items|container|status|count|qty|totalqty|total|ei|itemcount|location|name|field)$/i;

      // 1. Try JSON parsing (Objects or Arrays)
      if (cleaned.startsWith('[') || cleaned.startsWith('{')) {
        try {
          const parsed = JSON.parse(cleaned);
          
          // Case A: JSON Key-Value Object { "dz-P-A2000": 10, "dz-P-B3000": 5 }
          if (!Array.isArray(parsed) && typeof parsed === 'object') {
            Object.keys(parsed).forEach(key => {
              const cleanKey = key.replace(/[^a-zA-Z0-9_\-]/g, '').trim();
              const val = parseInt(parsed[key], 10);
              if (cleanKey && !ignoredKeys.test(cleanKey) && !isNaN(val)) {
                results.push({ station: cleanKey.replace(/\s+md-A$/i, ''), count: val });
              }
            });
            if (results.length > 0) return results;
          }

          // Case B: JSON Array of objects [{ "station": "dz-P-A2000", "count": 10 }]
          const list = Array.isArray(parsed) ? parsed : [parsed];
          list.forEach(item => {
            if (typeof item === 'object' && item !== null) {
              const station = item.scannableId || item.scannableIdName || item.station || item.containerId || item.id || item.location;
              const count = item.items ?? item.itemCount ?? item.quantity ?? item.count ?? item.qty;

              if (station && count !== undefined && !isNaN(parseInt(count, 10))) {
                const cleanStation = String(station).replace(/[^a-zA-Z0-9_\-]/g, '').replace(/\s+md-A$/i, '').trim();
                if (cleanStation && !ignoredKeys.test(cleanStation)) {
                  results.push({ station: cleanStation, count: parseInt(count, 10) });
                }
              }
            }
          });

          if (results.length > 0) return results;
        } catch (e) {}
      }

      // 2. Line-by-line parser for text / copied tables
      const lines = cleaned.split(/\r?\n/);

      lines.forEach(line => {
        const trimmedLine = line.trim();
        if (!trimmedLine) return;

        let tokens = trimmedLine.split(/[\t,]+|\s{2,}/).map(t => t.trim()).filter(Boolean);
        if (tokens.length < 2) {
          tokens = trimmedLine.split(/\s+/).map(t => t.trim()).filter(Boolean);
        }

        if (tokens.length >= 2) {
          let countIdx = -1;
          for (let i = tokens.length - 1; i >= 0; i--) {
            const cleanNum = tokens[i].replace(/[^0-9]/g, '');
            if (/^\d+$/.test(cleanNum) && cleanNum.length > 0) {
              countIdx = i;
              break;
            }
          }

          if (countIdx !== -1) {
            const count = parseInt(tokens[countIdx].replace(/[^0-9]/g, ''), 10);
            
            const stationCandidates = tokens.filter((t, idx) => {
              if (idx === countIdx) return false;
              const cleanWord = t.replace(/[^a-zA-Z0-9_\-]/g, '').trim();
              return cleanWord && !ignoredKeys.test(cleanWord) && !/^\d+$/.test(cleanWord);
            });

            if (stationCandidates.length > 0) {
              const station = stationCandidates.join(' ')
                .replace(/["':]/g, '')
                .replace(/\s+md-A$/i, '')
                .trim();
              
              if (station && !station.toLowerCase().includes('scannable id')) {
                results.push({ station, count });
              }
            }
          }
        }
      });

      return results;
    }

    function getFloorGroup(station) {
      if (/[ABpP]3|3\d{3}|P3/i.test(station)) return 'A3000';
      if (/[ABpP]4|4\d{3}|P4/i.test(station)) return 'A4000';
      return 'A2000';
    }

    function isFieldA(station) {
      return /[\-_]A\d+/i.test(station) || station.includes('md-A');
    }

    function renderTables() {
      const floors = {
        'A2000': { a: [], b: [], total: 0 },
        'A3000': { a: [], b: [], total: 0 },
        'A4000': { a: [], b: [], total: 0 }
      };

      Object.keys(masterInventory).forEach(station => {
        const count = masterInventory[station];
        const floorKey = getFloorGroup(station);
        floors[floorKey].total += count;

        if (isFieldA(station)) {
          floors[floorKey].a.push({ station, count });
        } else {
          floors[floorKey].b.push({ station, count });
        }
      });

      ['A2000', 'A3000', 'A4000'].forEach(floorKey => {
        const keyLower = floorKey.toLowerCase();
        const container = document.getElementById(`table-${keyLower}`);
        const badge = document.getElementById(`badge-${keyLower}`);
        const data = floors[floorKey];

        if (badge) badge.innerText = `${data.total.toLocaleString()} Units`;
        if (!container) return;

        if (data.a.length === 0 && data.b.length === 0) {
          container.innerHTML = `<div class="empty-msg">No ${floorKey} / B${floorKey.slice(1)} data</div>`;
          return;
        }

        let html = '<table>';
        if (data.a.length > 0) {
          html += `<tr class="section-header"><td colspan="2">A-FIELD STATIONS</td></tr>`;
          data.a.sort((x, y) => x.station.localeCompare(y.station)).forEach(row => {
            html += `<tr><td>${row.station}</td><td class="count-col">${row.count}</td></tr>`;
          });
        }
        if (data.b.length > 0) {
          html += `<tr class="section-header buffer-header"><td colspan="2">B-FIELD / BUFFER STATIONS</td></tr>`;
          data.b.sort((x, y) => x.station.localeCompare(y.station)).forEach(row => {
            html += `<tr><td>${row.station}</td><td class="count-col">${row.count}</td></tr>`;
          });
        }
        html += '</table>';
        container.innerHTML = html;
      });
    }

    function resetCalculator() {
      try {
        localStorage.removeItem('fc_master_inventory');
      } catch(e) {}
      masterInventory = {};
      document.getElementById('input-data').value = '';
      renderTables();
    }

    function exportToExcel() {
      if (typeof XLSX === 'undefined') {
        alert("SheetJS library not loaded.");
        return;
      }
      const rows = [['Station Name', 'Count', 'Floor', 'Field']];
      Object.keys(masterInventory).forEach(station => {
        rows.push([
          station, 
          masterInventory[station], 
          getFloorGroup(station), 
          isFieldA(station) ? 'A-Field' : 'B-Field/Buffer'
        ]);
      });
      
      const ws = XLSX.utils.aoa_to_sheet(rows);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Inventory Accumulation');
      XLSX.writeFile(wb, 'FC_Station_Counts.xlsx');
    }
  </script>
