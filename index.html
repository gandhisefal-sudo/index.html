<script>
  // Load saved data from localStorage on page load, or start with an empty object
  let masterInventory = JSON.parse(localStorage.getItem('fc_master_inventory')) || {};

  // Render saved data automatically as soon as the page loads/refreshes
  document.addEventListener('DOMContentLoaded', () => {
    renderTables();
  });

  function processData() {
    const rawText = document.getElementById('input-data').value;
    if (!rawText.trim()) return;

    const lines = rawText.trim().split('\n');

    lines.forEach(line => {
      const cols = line.split(/\t+|\s{2,}/).map(c => c.trim()).filter(Boolean);
      
      if (cols.length >= 2) {
        const station = cols[0];
        const count = parseInt(cols[1], 10);

        if (!station || isNaN(count) || station.toLowerCase().includes('scannable id')) return;

        if (masterInventory[station]) {
          masterInventory[station] += count;
        } else {
          masterInventory[station] = count;
        }
      }
    });

    // Save updated state to localStorage
    localStorage.setItem('fc_master_inventory', JSON.stringify(masterInventory));

    document.getElementById('input-data').value = '';
    renderTables();
  }

  function resetCalculator() {
    // Clear both memory and browser storage
    localStorage.removeItem('fc_master_inventory');
    masterInventory = {};
    document.getElementById('input-data').value = '';
    renderTables();
  }
</script>
